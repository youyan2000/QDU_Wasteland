<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="把 Gerber 与钻孔整理成 JLC 下单格式。">
  <title>NeXTJLC · 工具 · Wasteland</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/common.css">
  <link id="themesCss" rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/tool/_assets/tool-center.css">
  <script defer src="/icons.js"></script>
  <script defer src="/nav.js"></script>
  <style>
    .nw-grid{display:grid;grid-template-columns:1fr;gap:28px}
    @media(min-width:900px){.nw-grid{grid-template-columns:1fr 1fr}}
    .nw-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
    .nw-head h2{font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .badge{font-size:11px;padding:1px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}
    .nw-btn{padding:4px 14px;background:var(--ink,#16181d);color:#fff;font-size:13px;font-weight:600;border:0;border-radius:6px;cursor:pointer}
    .nw-btn[disabled]{background:#c9ced6;cursor:not-allowed}
    .nw-box{border:2px dashed #d1d5db;border-radius:10px;height:380px;padding:14px;display:flex;flex-direction:column;background:#fff}
    .nw-box ul{flex:1;overflow-y:auto;margin:0;padding:0;list-style:none}
    .nw-box li{display:flex;justify-content:space-between;align-items:center;padding:2px 8px;border-radius:4px}
    .nw-box li:hover{background:#f6f7f9}
    .nw-box li span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nw-box li button{opacity:0;border:0;background:none;color:#6b7280;cursor:pointer;font-size:14px;padding:0 4px}
    .nw-box li:hover button{opacity:1}
    .nw-box li button:hover{color:#b91c1c}
    .nw-empty{flex:1;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px;text-align:center}
    .nw-drop{margin-top:26px}
    .nw-bar{height:6px;background:#eef0f3;border-radius:999px;overflow:hidden;margin:14px 0 6px}
    .nw-bar>i{display:block;height:100%;width:0;background:var(--ink,#16181d);transition:width .18s}
    .nw-meta{font-size:13px;color:#6b7280;margin:0}
    .nw-err{color:#b91c1c;font-size:13px;margin-top:10px;white-space:pre-wrap}`n    .nw-sw{font-size:10px;font-weight:600;color:#6b7280;margin-left:6px;border:1px solid #e5e7eb;border-radius:999px;padding:0 6px}
  </style>
</head>
<body class="tools-body">
  <a class="skip-link" href="#nj">跳到工具内容</a>
  <div id="site-nav"></div>
  <main class="tools-main" id="nj">
    <nav class="tools-breadcrumb" aria-label="面包屑"><a href="/tool/">返回工具</a></nav>
    <header class="tools-heading">
      <p class="tools-kicker">PCB / GERBER</p>
      <h1>NeXTJLC</h1>
    </header>

    <div id="drop" class="nw-drop" style="border:2px dashed #d1d5db;border-radius:12px;padding:44px 24px;text-align:center;cursor:pointer;background:#fff">
      <strong style="display:block;font-size:17px;margin-bottom:6px">拖入 zip 或选择 Gerber 文件</strong>
      <span style="font-size:13px;color:#6b7280">支持 Altium / KiCad / EasyEDA 导出的 Gerber 与钻孔</span>
      <input id="file" type="file" multiple hidden style="display:none">
    </div>

    <div class="nw-grid" style="margin-top:26px">
      <section>
        <div class="nw-head">
          <h2>&#128269; Gerber Files<span id="badges"></span></h2>
          <button class="nw-btn" id="processBtn" disabled>Process</button>
        </div>
        <div class="nw-box">
          <ul id="inputList"></ul>
          <div class="nw-empty" id="inputEmpty">还没有文件</div>
        </div>
      </section>

      <section>
        <div class="nw-head">
          <h2>&#128230; Export Preview</h2>
          <button class="nw-btn" id="downloadBtn" disabled>Download</button>
        </div>
        <div class="nw-box">
          <ul id="outputList"></ul>
          <div class="nw-empty" id="outputEmpty">尚未处理</div>
        </div>
      </section>
    </div>

    <div class="nw-bar"><i id="barFill"></i></div>
    <p class="nw-meta" id="status"></p>
    <div class="nw-err" id="err"></div>
  </main>

<script src="/tool/nextjlc/app.js"></script>
</body>
</html>
