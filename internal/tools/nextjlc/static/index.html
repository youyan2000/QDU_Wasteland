<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="把 Gerber 与钻孔整理成 JLC 下单格式。">
  <title>NeXTJLC · 工具 · Wasteland</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/nav.css">
  <link rel="stylesheet" href="/common.css">
  <link id="themesCss" rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/tool/_assets/tool-center.css">
  <script defer src="/icons.js"></script>
  <script defer src="/themeboot.js"></script>
  <script defer src="/nav.js"></script>
  <style>
    /* 全部颜色走站点主题变量：默认 / 暗黑 / 赛博 / 简约 都能自动适配 */
    .nw-drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 44px 24px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg, 12px);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      text-align: center;
      transition: border-color .15s ease, background-color .15s ease;
    }
    .nw-drop:hover,
    .nw-drop.is-over {
      border-color: var(--magenta);
      background: color-mix(in srgb, var(--magenta) 5%, var(--surface));
    }
    .nw-drop strong { font-size: 1rem; font-weight: 600; }
    .nw-drop span { font-size: .85rem; color: var(--muted); }
    .nw-drop .nw-hint { font-size: .78rem; color: var(--muted); opacity: .85; }

    .nw-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 22px;
    }
    @media (min-width: 900px) { .nw-grid { grid-template-columns: 1fr 1fr; } }

    .nw-panel {
      display: flex;
      flex-direction: column;
      min-height: 340px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md, 10px);
      background: var(--surface);
      overflow: hidden;
    }
    .nw-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .nw-head h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0;
      font-size: .95rem;
      font-weight: 600;
      color: var(--ink);
    }
    .nw-count { color: var(--muted); font-weight: 400; font-size: .8rem; }
    .badge {
      font-size: 11px;
      line-height: 1.6;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--magenta-soft);
      color: var(--magenta-deep);
    }
    .nw-btn {
      padding: 6px 14px;
      border: 1px solid var(--magenta);
      border-radius: 8px;
      background: var(--magenta);
      color: #fff;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s ease;
    }
    .nw-btn:hover:not([disabled]) { background: var(--magenta-deep); }
    .nw-btn[disabled] {
      background: var(--track);
      border-color: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .nw-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 6px 6px 10px;
      min-height: 0;
    }
    .nw-box ul { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
    .nw-box li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 6px;
      color: var(--ink);
      font-size: .85rem;
    }
    .nw-box li + li { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
    .nw-box li:hover { background: var(--track); }
    .nw-box li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nw-box li button {
      flex: none;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      opacity: 0;
      transition: opacity .12s ease, color .12s ease;
    }
    .nw-box li:hover button,
    .nw-box li button:focus-visible { opacity: 1; }
    .nw-box li button:hover { color: var(--magenta); }
    .nw-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }
    .nw-sw {
      margin-left: 6px;
      padding: 0 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
    }

    .nw-bar {
      height: 4px;
      margin: 18px 0 8px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }
    .nw-bar > i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--magenta);
      transition: width .18s ease;
    }
    .nw-meta { margin: 0; font-size: .82rem; color: var(--muted); }
    .nw-err {
      margin-top: 10px;
      font-size: .82rem;
      color: var(--error, #c44536);
      white-space: pre-wrap;
    }
    @media (prefers-reduced-motion: reduce) {
      .nw-drop, .nw-btn, .nw-bar > i, .nw-box li button { transition: none; }
    }
  </style>
</head>
<body class="tools-body">
  <a class="skip-link" href="#nj">跳到工具内容</a>
  <div id="site-nav"></div>
  <main class="tools-main" id="nj">
    <nav class="tools-breadcrumb" aria-label="面包屑"><a href="/tool/">返回工具</a></nav>
    <header class="tools-heading">
      <p class="tools-kicker">PCB / GERBER</p>
      <h1>NeXTJLC</h1>
    </header>

    <div id="drop" class="nw-drop">
      <strong>拖入 zip 或选择 Gerber 文件</strong>
      <span>支持 Altium / KiCad / EasyEDA 导出的 Gerber 与钻孔</span>
      <span class="nw-hint">zip 会自动解包并列出其中的文件，也可以直接点这里选择</span>
      <input id="file" type="file" multiple hidden>
    </div>

    <div class="nw-grid">
      <section class="nw-panel">
        <div class="nw-head">
          <h2>Gerber Files <span class="nw-count" id="inputCount"></span><span id="badges"></span></h2>
          <button class="nw-btn" id="processBtn" disabled>Process</button>
        </div>
        <div class="nw-box">
          <ul id="inputList"></ul>
          <div class="nw-empty" id="inputEmpty">还没有文件</div>
        </div>
      </section>

      <section class="nw-panel">
        <div class="nw-head">
          <h2>Export Preview <span class="nw-count" id="outputCount"></span></h2>
          <button class="nw-btn" id="downloadBtn" disabled>Download</button>
        </div>
        <div class="nw-box">
          <ul id="outputList"></ul>
          <div class="nw-empty" id="outputEmpty">尚未处理</div>
        </div>
      </section>
    </div>

    <div class="nw-bar"><i id="barFill"></i></div>
    <p class="nw-meta" id="status"></p>
    <div class="nw-err" id="err"></div>
  </main>

<script src="/tool/nextjlc/app.js"></script>
</body>
</html>
