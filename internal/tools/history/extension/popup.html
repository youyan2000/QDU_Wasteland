<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Wasteland 足迹同步</title>
  <style>
    body { margin: 0; width: 260px; padding: 14px 16px; font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #fbfaf6; color: #1e292b; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    p { margin: 0 0 6px; color: #596565; font-size: 12px; }
    button { width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; border: 1px solid #b63d32; background: #b63d32; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: #1e292b; border-color: #c9cdc6; margin-top: 6px; }
    .err { color: #b63d32; }
    .ok { color: #277f78; }
  </style>
</head>
<body>
  <h1>Wasteland 浏览足迹</h1>
  <p id="state">读取中…</p>
  <button id="now">立即同步</button>
  <button id="open" class="secondary">打开设置</button>
  <script src="popup.js"></script>
</body>
</html>
