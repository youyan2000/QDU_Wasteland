<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Wasteland 足迹同步 · 设置</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; padding: 28px; font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f1f2ef; color: #1e292b; }
    .card { max-width: 560px; margin: 0 auto; background: #fbfaf6; border: 1px solid #d6d9d3; border-radius: 12px; padding: 22px 24px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.hint { margin: 0 0 18px; color: #596565; font-size: 12px; }
    label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid #c9cdc6; border-radius: 8px; font: inherit; background: #fff; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 18px; }
    button { padding: 9px 16px; border-radius: 8px; border: 1px solid #b63d32; background: #b63d32; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: #1e292b; border-color: #c9cdc6; }
    .status { margin-top: 16px; font-size: 12px; color: #596565; white-space: pre-wrap; }
    .ok { color: #277f78; }
    .err { color: #b63d32; }
    .switch { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; }
    ol { padding-left: 20px; color: #596565; font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wasteland 浏览足迹同步</h1>
    <p class="hint">配对一次，之后每 30 分钟自动同步；只推送到你自己的账号。<br><span id="version">版本读取中…</span></p>

    <ol>
      <li>在站点「工具 → 浏览足迹 → 数据备份」生成配对码。</li>
      <li>把站点地址和配对码填到下面，保存。</li>
      <li>点「立即同步」验证一次。</li>
    </ol>

    <label for="server">站点地址</label>
    <input id="server" type="text" placeholder="https://qdwasteland.top" autocomplete="off">

    <label for="token">配对码</label>
    <input id="token" type="password" placeholder="qw_..." autocomplete="off">

    <label class="switch"><input id="syncBili" type="checkbox"> 同时同步 B站观看历史（用你浏览器里的 B站 登录态；每次最多翻 20 页，约 600 条）</label>
    <label class="switch"><input id="enabled" type="checkbox"> 启用自动同步</label>

    <div class="row">
      <button id="save">保存</button>
      <button id="sync" class="secondary">立即同步</button>
      <button id="resync" class="secondary">重新全量同步</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
