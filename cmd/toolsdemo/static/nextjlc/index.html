<div class="w">
<p class="tag">PCB / GERBER</p>
<h1>NeXTJLC</h1>
<p>把 Gerber / 钻孔文件拖进来，整理后导出 JLC 下单格式。</p>
<div class="drop">把文件拖到这里（占位）</div>
<h2 style="font-size:18px">这一页在演示什么</h2>
<ul>
<li>静态前端由 <code>tools.Static</code> 从 <code>go:embed</code> 提供，没有外部目录依赖</li>
<li>路径已由框架剥掉 <code>/tool/nextjlc</code> 前缀，页面里只写相对路径</li>
<li>响应头固定 <code>Cache-Control: no-store</code> 与 <code>X-Content-Type-Options: nosniff</code></li>
</ul>
