<!DOCTYPE html>
<html lang="zh-CN">
<head>

    .nf-sub { color: var(--muted); margin-bottom: 1.6rem; }
    .nf-btn { display:inline-block; padding:.6rem 1.4rem; background: var(--magenta); color:#fff; border-radius:999px; text-decoration:none; font-weight:600; }
    .nf-btn:hover { background: var(--magenta-deep); }
