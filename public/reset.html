<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 · QDU Wasteland</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <a class="auth-logo" href="/">Wasteland</a>
    <p class="auth-tagline">找回你的登录密码</p>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="resetTab">重置密码</button>
      </div>

      <!-- 步骤1：输入邮箱 -->
      <div id="stepEmail" class="auth-form-panel">
        <div class="field">
          <label for="rpEmail">注册邮箱</label>
          <input id="rpEmail" type="email" placeholder="you@example.com" required>
        </div>
        <div class="err" id="resetErr"></div>
        <button class="auth-submit" id="rpSend">发送重置邮件</button>
      </div>

      <!-- 步骤2：设置新密码（带 token 时显示） -->
      <div id="stepNew" class="auth-form-panel hidden">
        <div class="field">
          <label for="rpPassword">新密码</label>
          <div class="pw-wrap">
            <input id="rpPassword" type="password" placeholder="至少 6 位" required>
            <button type="button" class="pw-toggle" data-target="rpPassword"><i class="icon-fill" data-icon="eye"></i></button>
          </div>
        </div>
        <div class="err" id="resetErr2"></div>
        <button class="auth-submit" id="rpConfirm">确认重置</button>
      </div>
    </div>
    <p class="auth-foot">已经想起来密码了？<a href="/login.html" style="color:var(--magenta)">返回登录</a></p>
  </div>

    <script src="/themeboot.js"></script>
<script src="auth.js"></script>
  <script src="/reset.js"></script>
<script src="icons.js"></script>
<script src="/icon-boot.js"></script>
  <script src="/wordbar.js" defer></script>
</body>
</html>
